# Candidate for the first unloaded field test; not a validated competition speed.
controller_frequency: 10.0
# Phase timeouts are resolved above move_base in NavigationBudget.
# These plugin patience limits describe local planner recovery behavior.
controller_patience: 3.0
planner_frequency: 1.0
planner_patience: 3.0
make_plan_clear_costmap: false
make_plan_add_unreachable_goal: false
oscillation_timeout: 8.0
oscillation_distance: 0.10
base_global_planner: global_planner/GlobalPlanner
base_local_planner: dwa_local_planner/DWAPlannerROS
# No automatic spinning or obstacle-clearing recovery in the first test.
recovery_behavior_enabled: false
clearing_rotation_allowed: false
shutdown_costmaps: false
DWAPlannerROS:
  max_vel_x: 0.08
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_trans: 0.08
  min_vel_trans: 0.02
  max_vel_theta: 0.30
  min_vel_theta: 0.10
  acc_lim_x: 0.20
  acc_lim_y: 0.0
  acc_lim_trans: 0.20
  acc_lim_theta: 0.60
  trans_stopped_vel: 0.015
  theta_stopped_vel: 0.03
  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.12
  sim_time: 1.5
  vx_samples: 8
  vy_samples: 1
  vth_samples: 24
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.8
  forward_point_distance: 0.15
  stop_time_buffer: 0.30
  scaling_speed: 0.07
  max_scaling_factor: 0.10
  oscillation_reset_dist: 0.05
NavfnROS:
  allow_unknown: false
  default_tolerance: 0.0
GlobalPlanner:
  allow_unknown: false
  use_dijkstra: true
  # GridPath failed to extract a route from the recorded near-board pose.
  # GradientPath passed the same start/goal and footprint checks on the robot.
  use_grid_path: false
global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  robot_radius: 0.20
  footprint_padding: 0.02
  transform_tolerance: 0.5
  update_frequency: 5.0
  publish_frequency: 2.0
  plugins:
    - {name: static_layer, type: 'costmap_2d::StaticLayer'}
    - {name: obstacle_layer, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation_layer, type: 'costmap_2d::InflationLayer'}
  static_layer: {enabled: true, track_unknown_space: true}
  obstacle_layer:
    enabled: true
    track_unknown_space: true
    footprint_clearing_enabled: true
    observation_sources: scan
    scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, obstacle_range: 4.0, raytrace_range: 4.5, min_obstacle_height: 0.0, max_obstacle_height: 1.5, inf_is_valid: false}
  inflation_layer: {enabled: true, inflation_radius: 0.30, cost_scaling_factor: 3.0}
local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint
  robot_radius: 0.20
  footprint_padding: 0.02
  transform_tolerance: 0.5
  update_frequency: 10.0
  publish_frequency: 2.0
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.05
  plugins:
    - {name: obstacle_layer, type: 'costmap_2d::ObstacleLayer'}
    - {name: inflation_layer, type: 'costmap_2d::InflationLayer'}
  obstacle_layer:
    enabled: true
    track_unknown_space: false
    footprint_clearing_enabled: true
    observation_sources: scan
    scan: {topic: /scan, data_type: LaserScan, marking: true, clearing: true, obstacle_range: 4.0, raytrace_range: 4.5, min_obstacle_height: 0.0, max_obstacle_height: 1.5, inf_is_valid: false}
  inflation_layer: {enabled: true, inflation_radius: 0.30, cost_scaling_factor: 3.0}
